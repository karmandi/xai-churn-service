name: Churn XAI CI Regression Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  eval-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic dataset if IBM CSV is absent
        run: |
          if [ ! -f data/churn.csv ]; then
            python -m src.data.synthetic
          fi

      - name: Train baseline model if artifact is absent
        run: |
          if [ ! -f artifacts/model.joblib ]; then
            python -m src.models.train
          fi

      - name: Generate golden eval dataset
        run: python -m src.evals.dataset

      - name: Run full test & regression gate suite
        run: python -m pytest -v

      - name: Run end-to-end eval runner and print summary
        run: python -m src.evals.runner
